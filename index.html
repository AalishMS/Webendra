<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small collection of things with -endra at the end." />
    <title>Webendra</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="showcase" aria-label="Webendra gallery">
      <button class="arrow arrow--previous" type="button" aria-label="Previous character">
        <span aria-hidden="true">←</span>
      </button>

      <figure class="character" aria-live="polite" aria-atomic="true">
        <div class="image-frame">
          <img
            id="character-image"
            src="assets/ballendra.png"
            alt="A man holding a basketball"
          />
        </div>
        <figcaption id="character-name">
          <span class="character-name">Ballendra</span>
        </figcaption>
      </figure>

      <button class="arrow arrow--next" type="button" aria-label="Next character">
        <span aria-hidden="true">→</span>
      </button>
    </main>

    <script src="app.js"></script>
  </body>
</html>
