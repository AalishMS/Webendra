<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webendra curator's table</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #11110f;
        --paper: #ffffff;
        --quiet: #686861;
        --rule: #d9d8d1;
        --wash: #f5f4ef;
        --focus: #2058c9;
        --success: #176b3a;
        --danger: #a72a22;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 280px; color: var(--ink); background: var(--paper); }
      button { font: inherit; }

      .masthead {
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1.25rem;
        align-items: end;
        padding: 1.25rem clamp(1rem, 4vw, 3rem);
        border-bottom: 1px solid var(--ink);
        background: rgba(255, 255, 255, 0.96);
      }

      .eyebrow, .position {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .eyebrow { margin: 0 0 0.25rem; color: var(--quiet); }
      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 4vw, 3.5rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }
      .instructions { max-width: 38rem; margin: 0.65rem 0 0; color: var(--quiet); font-size: 0.9rem; }
      .actions { display: flex; gap: 0.55rem; align-items: center; }
      .action, .nudge {
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
      }
      .action { min-height: 2.65rem; padding: 0.65rem 1rem; font-weight: 650; }
      .action--primary { background: var(--ink); color: var(--paper); }
      .action:disabled, .nudge:disabled { cursor: default; opacity: 0.38; }
      .action:focus-visible, .nudge:focus-visible, .piece:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      main { padding: clamp(1rem, 4vw, 3rem); }
      .state-line {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
        color: var(--quiet);
        font-size: 0.82rem;
      }
      .state-line [data-dirty="true"] { color: var(--danger); font-weight: 700; }
      .state-line [data-kind="success"] { color: var(--success); }
      .state-line [data-kind="error"] { color: var(--danger); }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: clamp(0.75rem, 2vw, 1.25rem);
        max-width: 1500px;
        margin: 0 auto;
        padding: 0;
        list-style: none;
      }
      .piece {
        position: relative;
        min-width: 0;
        border: 1px solid var(--rule);
        background: var(--paper);
        cursor: grab;
        user-select: none;
      }
      .piece:active { cursor: grabbing; }
      .piece.is-dragging { opacity: 0.36; }
      .piece.is-picked { border-color: var(--focus); box-shadow: inset 0 0 0 2px var(--focus); }
      .piece.drop-before::before, .piece.drop-after::after {
        position: absolute;
        z-index: 2;
        top: -0.45rem;
        bottom: -0.45rem;
        width: 4px;
        background: var(--focus);
        content: "";
      }
      .piece.drop-before::before { left: -0.55rem; }
      .piece.drop-after::after { right: -0.55rem; }
      .portrait {
        display: grid;
        width: 100%;
        aspect-ratio: 1;
        place-items: center;
        padding: 0.75rem;
        background: var(--wash);
        pointer-events: none;
      }
      .portrait img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
      .label {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0.6rem;
        align-items: center;
        min-height: 3.25rem;
        padding: 0.55rem 0.65rem;
        border-top: 1px solid var(--rule);
      }
      .position { color: var(--quiet); }
      .name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .grip { color: var(--quiet); font-size: 1rem; letter-spacing: -0.2em; }
      .nudges { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
      .nudge { min-height: 2rem; border: 0; }
      .nudge + .nudge { border-left: 1px solid var(--rule); }
      .nudge:not(:disabled):hover, .action:not(:disabled):hover { background: var(--wash); }
      .action--primary:not(:disabled):hover { background: #34342f; }
      .empty { padding: 3rem; color: var(--danger); text-align: center; }

      @media (max-width: 680px) {
        .masthead { position: static; grid-template-columns: 1fr; align-items: start; }
        .actions { width: 100%; }
        .action { flex: 1; }
        .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 350px) { .gallery { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: no-preference) {
        .piece { transition: opacity 120ms ease, box-shadow 120ms ease; }
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div>
        <p class="eyebrow">Private collection room</p>
        <h1>Curator’s table</h1>
        <p class="instructions">Drag a distinguished guest into position. For the keyboard: focus a piece, press Space, move it with the arrow keys, then press Space again.</p>
      </div>
      <div class="actions">
        <button class="action" id="reset" type="button" disabled>Reset</button>
        <button class="action action--primary" id="save" type="button" disabled>Save order</button>
      </div>
    </header>
    <main>
      <div class="state-line">
        <span id="count">Loading the collection…</span>
        <span id="status" role="status" aria-live="polite">No changes</span>
      </div>
      <ol class="gallery" id="gallery" aria-label="Artwork order"></ol>
      <p class="empty" id="error" hidden></p>
    </main>

    <script>
      "use strict";
      const gallery = document.querySelector("#gallery");
      const count = document.querySelector("#count");
      const status = document.querySelector("#status");
      const error = document.querySelector("#error");
      const resetButton = document.querySelector("#reset");
      const saveButton = document.querySelector("#save");
      let characters = [];
      let initialOrder = [];
      let currentOrder = [];
      let revision = "";
      let draggedSlug = null;
      let pickedSlug = null;
      let pickupOrder = null;
      let saving = false;

      const characterMap = () => new Map(characters.map((character) => [character.slug, character]));
      const isDirty = () => currentOrder.some((slug, index) => slug !== initialOrder[index]);
      const escapeMarkup = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[character]);

      function setStatus(message, kind = "") {
        status.textContent = message;
        status.dataset.kind = kind;
        status.dataset.dirty = String(isDirty());
      }
      function updateControls(announce = true) {
        const dirty = isDirty();
        resetButton.disabled = saving || !dirty;
        saveButton.disabled = saving || !dirty;
        if (announce && !saving) setStatus(dirty ? "Unsaved order" : "No changes");
      }
      function move(fromIndex, toIndex, focusSlug) {
        if (fromIndex === toIndex || fromIndex < 0 || toIndex < 0 || toIndex >= currentOrder.length) return;
        const [slug] = currentOrder.splice(fromIndex, 1);
        currentOrder.splice(toIndex, 0, slug);
        render(focusSlug || slug);
        setStatus(`${characterMap().get(slug).name} is now number ${toIndex + 1}.`);
      }
      function clearDropMarks() {
        gallery.querySelectorAll(".drop-before, .drop-after").forEach((piece) => {
          piece.classList.remove("drop-before", "drop-after");
        });
      }
      function render(focusSlug = null) {
        const lookup = characterMap();
        gallery.replaceChildren(...currentOrder.map((slug, index) => {
          const character = lookup.get(slug);
          const item = document.createElement("li");
          item.className = "piece";
          item.dataset.slug = slug;
          item.draggable = true;
          item.tabIndex = 0;
          item.setAttribute("aria-label", `${character.name}, position ${index + 1} of ${currentOrder.length}. Press Space to pick up.`);
          item.setAttribute("aria-grabbed", String(pickedSlug === slug));
          if (pickedSlug === slug) item.classList.add("is-picked");
          item.innerHTML = `
            <div class="portrait"><img src="${escapeMarkup(character.image)}" alt="${escapeMarkup(character.alt)}"></div>
            <div class="label">
              <span class="position">${String(index + 1).padStart(2, "0")}</span>
              <span class="name">${escapeMarkup(character.displayName || character.name)}</span>
              <span class="grip" aria-hidden="true">⠿</span>
            </div>
            <div class="nudges">
              <button class="nudge" type="button" data-direction="-1" aria-label="Move ${escapeMarkup(character.name)} earlier" ${index === 0 ? "disabled" : ""}>← Earlier</button>
              <button class="nudge" type="button" data-direction="1" aria-label="Move ${escapeMarkup(character.name)} later" ${index === currentOrder.length - 1 ? "disabled" : ""}>Later →</button>
            </div>`;
          item.querySelectorAll(".nudge").forEach((button) => button.addEventListener("click", (event) => {
            event.stopPropagation();
            move(index, index + Number(button.dataset.direction), slug);
          }));
          item.addEventListener("dragstart", (event) => {
            draggedSlug = slug;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", slug);
            requestAnimationFrame(() => item.classList.add("is-dragging"));
          });
          item.addEventListener("dragend", () => {
            draggedSlug = null;
            item.classList.remove("is-dragging");
            clearDropMarks();
          });
          item.addEventListener("dragover", (event) => {
            if (!draggedSlug || draggedSlug === slug) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            const box = item.getBoundingClientRect();
            const nearMiddleRow = Math.abs(event.clientY - (box.top + box.height / 2)) < box.height * 0.35;
            const before = nearMiddleRow ? event.clientX < box.left + box.width / 2 : event.clientY < box.top + box.height / 2;
            clearDropMarks();
            item.classList.add(before ? "drop-before" : "drop-after");
          });
          item.addEventListener("drop", (event) => {
            event.preventDefault();
            const before = item.classList.contains("drop-before");
            const from = currentOrder.indexOf(draggedSlug);
            let insertion = currentOrder.indexOf(slug) + (before ? 0 : 1);
            if (from < insertion) insertion -= 1;
            insertion = Math.max(0, Math.min(currentOrder.length - 1, insertion));
            clearDropMarks();
            move(from, insertion, draggedSlug);
          });
          item.addEventListener("keydown", (event) => handleKeyboard(event, slug));
          return item;
        }));
        updateControls();
        if (focusSlug) gallery.querySelector(`[data-slug="${focusSlug}"]`)?.focus();
      }

      function handleKeyboard(event, slug) {
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          if (pickedSlug === slug) {
            pickedSlug = null;
            pickupOrder = null;
            render(slug);
            setStatus(`${characterMap().get(slug).name} placed.`);
          } else {
            pickedSlug = slug;
            pickupOrder = [...currentOrder];
            render(slug);
            setStatus(`${characterMap().get(slug).name} picked up. Use arrow keys to move it.`);
          }
          return;
        }
        if (event.key === "Escape" && pickedSlug) {
          event.preventDefault();
          currentOrder = pickupOrder;
          const cancelled = pickedSlug;
          pickedSlug = null;
          pickupOrder = null;
          render(cancelled);
          setStatus("Keyboard move cancelled.");
          return;
        }
        if (pickedSlug !== slug) return;
        const index = currentOrder.indexOf(slug);
        const destinations = {
          ArrowLeft: index - 1,
          ArrowUp: index - 1,
          ArrowRight: index + 1,
          ArrowDown: index + 1,
          Home: 0,
          End: currentOrder.length - 1,
        };
        if (!(event.key in destinations)) return;
        event.preventDefault();
        move(index, Math.max(0, Math.min(currentOrder.length - 1, destinations[event.key])), slug);
      }

      resetButton.addEventListener("click", () => {
        currentOrder = [...initialOrder];
        pickedSlug = null;
        pickupOrder = null;
        render();
        setStatus("Order reset.");
      });
      saveButton.addEventListener("click", async () => {
        saving = true;
        saveButton.textContent = "Saving…";
        updateControls();
        setStatus("Updating the gallery…");
        try {
          const response = await fetch("/api/order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ revision, order: currentOrder }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "The order could not be saved.");
          revision = result.revision;
          initialOrder = [...currentOrder];
          setStatus(result.message, "success");
        } catch (failure) {
          setStatus(failure.message, "error");
        } finally {
          saving = false;
          saveButton.textContent = "Save order";
          updateControls(false);
        }
      });
      window.addEventListener("beforeunload", (event) => {
        if (!isDirty()) return;
        event.preventDefault();
        event.returnValue = "";
      });
      async function load() {
        try {
          const response = await fetch("/api/catalogue", { cache: "no-store" });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "The catalogue could not be loaded.");
          characters = result.characters;
          revision = result.revision;
          initialOrder = characters.map((character) => character.slug);
          currentOrder = [...initialOrder];
          count.textContent = `${characters.length} artworks`;
          render();
        } catch (failure) {
          gallery.hidden = true;
          error.hidden = false;
          error.textContent = failure.message;
          count.textContent = "Catalogue unavailable";
          setStatus("Nothing moved", "error");
        }
      }
      load();
    </script>
  </body>
</html>
