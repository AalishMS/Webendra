[package]
name = "webendra-server"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "webendra-server"
path = "src/main.rs"

[dependencies]
webendra-shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
serde_json = "1"
http = "1"
