[package]
name = "webendra-web"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "webendra_web"
path = "src/lib.rs"

[dependencies]
webendra-shared = { path = "../shared" }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlButtonElement",
  "Node",
  "NodeList",
  "DomTokenList",
  "CssStyleDeclaration",
  "History",
  "Location",
  "MediaQueryList",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "PopStateEvent",
  "MouseEvent",
  "Animation",
  "AnimationPlayState",
  "KeyframeAnimationOptions",
  "FillMode",
  "IdleDeadline",
  "AddEventListenerOptions",
  "console",
]
